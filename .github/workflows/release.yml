name: Build domestic OSS release package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m playwright install chromium
      - name: Build complete Windows package and update payload
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "抖音作品提取" --paths . --add-data "web;web" --collect-all webview --collect-all openpyxl --collect-all multipart desktop_app.py
          $version = "${{ github.ref_name }}".TrimStart("v")
          $root = "release/douyin-works-extractor-$version-windows-x64"
          New-Item -ItemType Directory -Path "$root/app" -Force | Out-Null
          Copy-Item -Path "dist/抖音作品提取/*" -Destination "$root/app" -Recurse -Force
          # pywebview 的 WinForms 后端依赖 pythonnet；把 Windows Desktop Runtime
          # 放进发布目录，避免目标电脑未安装 .NET 时启动崩溃。
          $dotnetDir = Join-Path $root "app/dotnet"
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
          # dotnet-install 的 windowsdesktop 压缩包仅含 WindowsDesktop shared
          # framework；host/fxr 与 Microsoft.NETCore.App 要先由 dotnet runtime 提供。
          & .\dotnet-install.ps1 -Runtime dotnet -Channel 8.0 -Architecture x64 -InstallDir $dotnetDir -NoPath
          if ($LASTEXITCODE -ne 0) { throw "Bundled .NET Desktop Runtime installation failed." }
          & .\dotnet-install.ps1 -Runtime windowsdesktop -Channel 8.0 -Architecture x64 -InstallDir $dotnetDir -NoPath -SkipNonVersionedFiles
          if ($LASTEXITCODE -ne 0) { throw "Bundled .NET Desktop Runtime installation failed." }
          $desktopRuntime = Get-ChildItem -LiteralPath "$dotnetDir/shared/Microsoft.WindowsDesktop.App" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $desktopRuntime) { throw "Bundled .NET Desktop Runtime is missing Microsoft.WindowsDesktop.App." }
          $runtimeConfig = @{ runtimeOptions = @{ tfm = "net8.0"; rollForward = "LatestPatch"; framework = @{ name = "Microsoft.WindowsDesktop.App"; version = $desktopRuntime.Name } } } | ConvertTo-Json -Depth 4
          Set-Content -LiteralPath "$dotnetDir/pythonnet.runtimeconfig.json" -Value $runtimeConfig -Encoding utf8
          # windowsdesktop 是嵌入式 shared runtime，不包含 dotnet.exe（CLI/SDK
          # 才需要）。启动 pythonnet 所需的是 host/fxr 与 runtimeconfig。
          $requiredRuntimeFiles = @("$dotnetDir/pythonnet.runtimeconfig.json", "$dotnetDir/host/fxr")
          foreach ($requiredRuntimeFile in $requiredRuntimeFiles) {
            if (-not (Test-Path -LiteralPath $requiredRuntimeFile)) { throw "Bundled .NET runtime item missing: $requiredRuntimeFile" }
          }
          New-Item -ItemType Directory -Path "$root/app/ms-playwright" -Force | Out-Null
          Get-ChildItem -LiteralPath "$env:LOCALAPPDATA/ms-playwright" -Directory |
            Where-Object { $_.Name -match '^(chromium|chromium_headless_shell|ffmpeg)-' } |
            Copy-Item -Destination "$root/app/ms-playwright" -Recurse -Force
          Set-Content -LiteralPath "$root/app/version.json" -Value ('{"version":"' + $version + '"}') -Encoding utf8
          Copy-Item Start-App.cmd "$root/Start-App.cmd" -Force
          Copy-Item Update-App.ps1 "$root/Update-App.ps1" -Force
          Compress-Archive -LiteralPath "$root/app" -DestinationPath "release/app.zip" -Force
          $sha256 = (Get-FileHash -LiteralPath "release/app.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{ version = $version; url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app.zip"; sha256 = $sha256 } | ConvertTo-Json -Compress
          Set-Content -LiteralPath "release/latest.json" -Value $manifest -Encoding utf8
          Compress-Archive -LiteralPath $root -DestinationPath "$root.zip" -Force
      - name: Arrange OSS upload files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          powershell -NoProfile -ExecutionPolicy Bypass -File Prepare-DomesticRelease.ps1 -Version $version -UpdatePackage release/app.zip -FullPackage "release/douyin-works-extractor-$version-windows-x64.zip" -OutputDirectory oss-upload
      - name: Keep verified OSS upload package
        uses: actions/upload-artifact@v4
        with:
          name: douyin-works-extractor-oss-${{ github.ref_name }}
          path: oss-upload/updates
