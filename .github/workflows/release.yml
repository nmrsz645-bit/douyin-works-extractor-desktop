name: Build domestic OSS release package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m playwright install chromium
      - name: Build complete Windows package and update payload
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "抖音作品提取" --paths . --add-data "web;web" --collect-all webview --collect-all openpyxl --collect-all multipart desktop_app.py
          $version = "${{ github.ref_name }}".TrimStart("v")
          $root = "release/douyin-works-extractor-$version-windows-x64"
          New-Item -ItemType Directory -Path "$root/app" -Force | Out-Null
          Copy-Item -Path "dist/抖音作品提取/*" -Destination "$root/app" -Recurse -Force
          # 当前 pywebview/WinForms 组合使用 Windows .NET Framework 后端。
          # desktop_app.py 会在创建窗口前验证该运行时，并在缺失时展示明确安装提示；
          # 不要捆绑不兼容的 CoreCLR Windows Desktop Runtime。
          New-Item -ItemType Directory -Path "$root/app/ms-playwright" -Force | Out-Null
          Get-ChildItem -LiteralPath "$env:LOCALAPPDATA/ms-playwright" -Directory |
            Where-Object { $_.Name -match '^(chromium|chromium_headless_shell|ffmpeg)-' } |
            Copy-Item -Destination "$root/app/ms-playwright" -Recurse -Force
          Set-Content -LiteralPath "$root/app/version.json" -Value ('{"version":"' + $version + '"}') -Encoding utf8
          Copy-Item Start-App.cmd "$root/Start-App.cmd" -Force
          Copy-Item Update-App.ps1 "$root/Update-App.ps1" -Force
          Compress-Archive -LiteralPath "$root/app" -DestinationPath "release/app.zip" -Force
          Compress-Archive -LiteralPath $root -DestinationPath "$root.zip" -Force
      - name: Arrange OSS upload files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          powershell -NoProfile -ExecutionPolicy Bypass -File Prepare-DomesticRelease.ps1 -Version $version -UpdatePackage release/app.zip -UpdatePackageName "douyin-works-extractor-update-$version.zip" -FullPackage "release/douyin-works-extractor-$version-windows-x64.zip" -OutputDirectory oss-upload
      - name: Keep verified OSS upload package
        uses: actions/upload-artifact@v4
        with:
          name: douyin-works-extractor-oss-${{ github.ref_name }}
          path: oss-upload/updates
      - name: Record OIDC signing-key fingerprint
        shell: pwsh
        run: |
          # Only decode the public JWT header. Never print the short-lived token.
          $oidc = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=github-actions"
          $headerPart = $oidc.value.Split('.')[0].Replace('-', '+').Replace('_', '/')
          $headerPart = $headerPart.PadRight($headerPart.Length + ((4 - $headerPart.Length % 4) % 4), '=')
          $header = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($headerPart)) | ConvertFrom-Json
          $fingerprint = if ($header.x5t) { (([Convert]::FromBase64String($header.x5t.Replace('-', '+').Replace('_', '/').PadRight($header.x5t.Length + ((4 - $header.x5t.Length % 4) % 4), '='))) | ForEach-Object { $_.ToString('X2') }) -join '' } else { 'none' }
          Write-Host "OIDC public signing key: kid=$($header.kid); sha1=$fingerprint"
      - name: Configure temporary Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_OSS_RELEASE_ROLE_ARN }}
          role-session-name: douyin-oss-release
          audience: github-actions
      - name: Publish verified packages to Alibaba Cloud OSS
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check oss2
          python scripts/publish_oss_release.py --directory oss-upload/updates
