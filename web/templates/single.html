{% extends "base.html" %}
{% block content %}
<section style="max-width:1100px;margin:10px auto">
  <h1>抖音单作品提取</h1>
  <p style="color:var(--text-secondary)">每行粘贴一个抖音作品链接。成功读取后会即时显示作者昵称、标题、发布时间、播放量、点赞数和分享数。</p>
  <label for="video-urls">作品链接（一行一个）</label>
  <textarea id="video-urls" rows="8" placeholder="https://www.douyin.com/video/...&#10;https://v.douyin.com/..." style="width:min(880px,100%);margin-top:8px"></textarea>
  <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button id="extract" class="btn btn-primary" onclick="extractVideos()">开始提取</button>
    <span id="status" style="font-size:14px;color:var(--text-secondary)">粘贴作品链接后开始提取。</span>
  </div>
</section>

<section style="max-width:1100px;margin:34px auto">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
    <h2 style="margin:0;font-size:18px">单作品提取结果</h2>
    <div style="display:flex;gap:8px">
      <button id="download-selected" class="btn btn-outline btn-sm" onclick="downloadSelected()" style="display:none" disabled>下载勾选视频</button>
      <button id="export-xlsx" class="btn btn-outline btn-sm" onclick="exportXlsx()" style="display:none">导出 XLSX</button>
    </div>
  </div>
  <div style="overflow:auto;margin-top:12px">
    <table class="table" id="result-table">
      <thead><tr><th>选择</th><th>作者昵称</th><th>发布时间</th><th>标题</th><th>播放量</th><th>点赞数</th><th>分享数</th><th>作品链接</th></tr></thead>
      <tbody><tr><td colspan="8" style="color:var(--text-secondary)">提取到的作品会即时显示在这里。</td></tr></tbody>
    </table>
  </div>
</section>

<script>
let singleTimer=null, singleLoading=false, downloadTimer=null;
const fmt=v=>Number(v||0).toLocaleString();
function updateDownloadButton(){const selected=document.querySelectorAll('.result-select:checked').length,b=document.getElementById('download-selected');b.disabled=!selected;b.textContent=selected?`下载勾选视频（${selected}）`:'下载勾选视频'}
async function loadResults(){const r=await fetch('/api/single-results'),j=await r.json();if(!r.ok)throw new Error(j.error||'读取结果失败');const b=document.querySelector('#result-table tbody');b.innerHTML='';if(!j.rows.length)b.innerHTML='<tr><td colspan="8">正在等待作品资料…</td></tr>';for(const x of j.rows){const tr=document.createElement('tr'),select=document.createElement('td'),box=document.createElement('input');box.type='checkbox';box.className='result-select';box.value=x.video_id;box.checked=true;box.onchange=updateDownloadButton;select.appendChild(box);tr.appendChild(select);[x.author_name||'-',x.publish_time,x.title||'-',fmt(x.view_count),fmt(x.like_count),fmt(x.share_count)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const td=document.createElement('td'),a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent='打开作品';td.appendChild(a);tr.appendChild(td);b.appendChild(tr)}const hasRows=!!j.rows.length;document.getElementById('export-xlsx').style.display=hasRows?'inline-flex':'none';document.getElementById('download-selected').style.display=hasRows?'inline-flex':'none';updateDownloadButton()}
async function updateStatus(){try{const r=await fetch('/api/single-status'),s=await r.json();if(s.running){document.getElementById('status').textContent=`正在读取 ${s.current||0}/${s.total||0}：${s.message}（成功 ${s.found||0} 条）`;if(!singleLoading){singleLoading=true;try{await loadResults()}finally{singleLoading=false}}}}catch(e){}}
async function extractVideos(){const urls=document.getElementById('video-urls').value.trim();if(!urls)return showToast('请逐行粘贴作品链接','warning');const b=document.getElementById('extract');b.disabled=true;b.textContent='提取中…';document.querySelector('#result-table tbody').innerHTML='<tr><td colspan="8">已清空上次结果，正在读取本次作品…</td></tr>';document.getElementById('export-xlsx').style.display='none';document.getElementById('download-selected').style.display='none';document.getElementById('status').textContent='正在清空上次结果并准备打开作品链接…';singleTimer=setInterval(updateStatus,700);try{const r=await fetch('/api/single-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls})}),j=await r.json();if(!r.ok)throw new Error(j.error||'提取失败');document.getElementById('status').textContent=`完成：成功 ${j.total} 条`+(j.failed?.length?`；失败 ${j.failed.length} 条。请在浏览器确认登录或验证后可重试失败链接。`:'');await loadResults()}catch(e){document.getElementById('status').textContent=e.message;showToast(e.message,'error')}finally{clearInterval(singleTimer);singleTimer=null;b.disabled=false;b.textContent='开始提取'}}
async function pollDownload(){try{const r=await fetch('/api/download-status'),d=await r.json();if(d.running){document.getElementById('status').textContent=`正在下载 ${d.done+d.failed}/${d.total}：${d.message}`;return}if(downloadTimer){clearInterval(downloadTimer);downloadTimer=null;document.getElementById('status').textContent=d.message;showToast(d.message,d.failed?'warning':'success')}}catch(e){}}
async function downloadSelected(){const ids=[...document.querySelectorAll('.result-select:checked')].map(x=>x.value);if(!ids.length)return;const b=document.getElementById('download-selected');b.disabled=true;b.textContent='请选择保存位置…';try{const r=await fetch('/api/downloads/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'single',ids})}),j=await r.json();if(!r.ok)throw new Error(j.error||'下载任务启动失败');if(j.cancelled){document.getElementById('status').textContent='已取消选择保存位置';return}document.getElementById('status').textContent=`正在下载 ${j.total} 条视频到：${j.path}`;downloadTimer=setInterval(pollDownload,800)}catch(e){showToast(e.message,'error');document.getElementById('status').textContent=e.message}finally{updateDownloadButton()}}
async function exportXlsx(){const b=document.getElementById('export-xlsx');b.disabled=true;b.textContent='正在选择位置…';try{const r=await fetch('/api/single-results/export-xlsx/save',{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error||'导出失败');if(j.cancelled){document.getElementById('status').textContent='已取消导出';return}document.getElementById('status').textContent=`XLSX 已导出：${j.path}`;showToast('XLSX 已保存','success')}catch(e){showToast(e.message,'error')}finally{b.disabled=false;b.textContent='导出 XLSX'}}
loadResults();
</script>
{% endblock %}
